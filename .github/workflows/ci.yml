name: WordPress Plugin CI

on:
  push:
    branches: [main]
    paths:
      - 'wp-plugin/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'wp-plugin/**'
      - '.github/workflows/ci.yml'

jobs:
  phpunit:
    name: PHPUnit and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover

      - name: Enforce minimum line coverage of 80 percent
        run: |
          php -r '
            $xml = simplexml_load_file("coverage.clover");
            $m = $xml->project->metrics;
            $covered = (int) $m["coveredstatements"];
            $total = (int) $m["statements"];
            $pct = $total > 0 ? ($covered / $total) * 100 : 0;
            printf("Line coverage: %.2f%% (%d/%d)\n", $pct, $covered, $total);
            if ($pct < 80.0) {
              fwrite(STDERR, "Coverage below the 80 percent floor.\n");
              exit(1);
            }
          '
