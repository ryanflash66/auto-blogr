name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vitest.config.js'
      - 'index.html'
      - 'eslint.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'jsconfig.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vitest.config.js'
      - 'index.html'
      - 'eslint.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'jsconfig.json'
      - '.github/workflows/web.yml'

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
