schema_version: 1

# Branching policy for AutoBlogr (ADR-0003).
#
# Mirrors the policy already documented in .claude/steering/: autonomous work
# merges to `dev` on green CI, and promotion `dev` -> `main` is a human step.

production_branch: main
integration_branch: dev

auto_merge:
  enabled: true
  # Invariant, not a setting: autonomous merges never target production.
  target: integration
  # The real merge gate from .claude/steering/quality-gates.md. Must be
  # observably green; pending, missing, or errored is not green.
  required_checks:
    - Lint and build
  # Work touching a protected surface is excluded from autonomous merge and
  # from autonomous selection.
  exclude_protected_surfaces: true
  require_independent_review: false

promotion:
  from: integration
  to: production
  actor: human
  notes: >-
    Production ships only after a human promotes dev to main (Vercel deploy
    target). See .claude/steering/safety-rules.md.

branch_naming:
  work_branch_prefix: dev-loop/
  require_issue_key: true
